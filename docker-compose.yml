services:
  # ----------------------------------------------------------------------------
  # Web Server (Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: inventaris_web
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - inventaris_network

  # ----------------------------------------------------------------------------
  # Backend Application (Laravel 13 + PHP 8.4-FPM)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventaris_app
    restart: unless-stopped
    environment:
      APP_NAME: "Inventaris Perangkat TI"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${DOCKER_WEB_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-it_inventaris}
      DB_USERNAME: ${DB_USERNAME:-it_user}
      DB_PASSWORD: ${DB_PASSWORD:-it_secret123}
      SESSION_DRIVER: database
      CACHE_STORE: database
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaris_network

  # ----------------------------------------------------------------------------
  # Database (MariaDB 10.11 LTS)
  # ----------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: inventaris_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-it_inventaris}
      MYSQL_USER: ${DB_USERNAME:-it_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-it_secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret123}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DOCKER_DB_PORT:-33060}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - inventaris_network

# ------------------------------------------------------------------------------
# Networks & Volumes
# ------------------------------------------------------------------------------
networks:
  inventaris_network:
    driver: bridge

volumes:
  db_data:
    driver: local
